<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="brand-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- logo, scaled 3x, vertically centered on the left -->
  <g transform="translate(165,165) scale(3)">
    <rect x="4" y="4" width="92" height="92" rx="21" fill="#141417" stroke="#2a2a2e" stroke-width="1"/>

    <g stroke="#f5f4f1" stroke-width="2" stroke-linecap="round" opacity="0.4">
      <line x1="37" y1="29" x2="21" y2="16"/>
      <line x1="37" y1="71" x2="21" y2="84"/>
      <line x1="69" y1="50" x2="87" y2="50"/>
    </g>
    <g fill="#f5f4f1" opacity="0.55">
      <circle cx="21" cy="16" r="3"/>
      <circle cx="21" cy="84" r="3"/>
      <circle cx="87" cy="50" r="3"/>
    </g>

    <polygon points="37,29 37,71 69,50" fill="url(#brand)"/>
    <g fill="#f5f4f1" stroke="#0a0a0c" stroke-width="2">
      <circle cx="37" cy="29" r="4.5"/>
      <circle cx="37" cy="71" r="4.5"/>
      <circle cx="69" cy="50" r="4.5"/>
    </g>
  </g>

  <text x="520" y="345" text-anchor="start" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="700" fill="url(#brand-text)" letter-spacing="1">Play Assist</text>
</svg>
